<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mini Messenger 2.0</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      color: #222;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #auth {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .auth-box h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .auth-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .auth-box input:focus {
      border-color: #4d8cff;
    }

    .primary {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #4d8cff;
      color: white;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .secondary {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #e9edf5;
      color: #222;
      font-weight: bold;
    }

    #authMessage {
      min-height: 20px;
      text-align: center;
      margin-bottom: 10px;
      color: #d33;
    }

    /* APP */

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #eef2f7;
      font-size: 19px;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 330px;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .search {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .user-item:hover {
      background: #f5f7fa;
    }

    .user-item.active {
      background: #eaf2ff;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #dce7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: bold;
      color: #315aa8;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-status {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #28c76f;
      flex-shrink: 0;
    }

    /* CHAT */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #edf1f5;
    }

    .chat-header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px;
      flex-shrink: 0;
    }

    .back-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 25px;
    }

    .chat-user-info {
      min-width: 0;
    }

    .chat-name {
      font-weight: bold;
      font-size: 17px;
    }

    .chat-status {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-chat {
      margin: auto;
      color: #777;
      text-align: center;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: min(75%, 600px);
      padding: 9px 11px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      position: relative;
    }

    .message-row.mine .message {
      background: #dceaff;
    }

    .message-text {
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 5px;
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 4px;
      font-size: 10px;
      color: #777;
    }

    .message-actions {
      display: flex;
      gap: 3px;
    }

    .message-action {
      border: 0;
      background: transparent;
      font-size: 12px;
      padding: 1px 3px;
      color: #666;
    }

    .message-action:hover {
      color: #111;
    }

    .deleted {
      color: #888;
      font-style: italic;
    }

    .edited {
      font-size: 10px;
      color: #888;
    }

    .message-form {
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 11px 13px;
      outline: none;
      max-height: 120px;
    }

    .send-button {
      width: 48px;
      border: 0;
      border-radius: 14px;
      background: #4d8cff;
      color: white;
      font-size: 19px;
    }

    /* PROFILE */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 22px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .profile-avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #dce7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-size: 35px;
      font-weight: bold;
      color: #315aa8;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-label {
      display: block;
      text-align: center;
      margin-bottom: 18px;
      color: #4d8cff;
      cursor: pointer;
      font-weight: bold;
    }

    .profile-input,
    .profile-textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      outline: none;
    }

    .profile-textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      font-weight: bold;
    }

    .save-profile {
      background: #4d8cff;
      color: white;
    }

    .close-modal {
      background: #e9edf5;
      color: #222;
    }

    .profile-message {
      min-height: 20px;
      color: #d33;
      text-align: center;
      margin-bottom: 8px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat {
        display: none;
      }

      .layout.chat-open .sidebar {
        display: none;
      }

      .layout.chat-open .chat {
        display: flex;
      }

      .back-button {
        display: block;
      }

      .topbar-title {
        font-size: 18px;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->

  <section id="auth">
    <div class="auth-box">

      <h1>💬 Mini Messenger</h1>

      <div id="authMessage"></div>

      <input
        id="username"
        type="text"
        placeholder="Логин"
        autocomplete="username"
      />

      <input
        id="password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
      />

      <button class="primary" id="loginBtn">
        Войти
      </button>

      <button class="secondary" id="registerBtn">
        Создать аккаунт
      </button>

    </div>
  </section>


  <!-- APP -->

  <section id="app" class="hidden">

    <header class="topbar">

      <div class="topbar-title">
        💬 Mini Messenger
      </div>

      <div class="topbar-right">

        <button
          class="icon-button"
          id="profileBtn"
          title="Профиль"
        >
          👤
        </button>

        <button
          class="icon-button"
          id="logoutBtn"
          title="Выйти"
        >
          🚪
        </button>

      </div>

    </header>


    <div class="layout" id="layout">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <div class="sidebar-header">

          <input
            class="search"
            id="searchInput"
            type="text"
            placeholder="🔎 Найти пользователя..."
          />

        </div>

        <div
          class="user-list"
          id="userList"
        ></div>

      </aside>


      <!-- CHAT -->

      <main class="chat">

        <div class="chat-header">

          <button
            class="back-button"
            id="backBtn"
          >
            ←
          </button>

          <div
            class="avatar"
            id="chatAvatar"
          >
            ?
          </div>

          <div class="chat-user-info">

            <div
              class="chat-name"
              id="chatName"
            >
              Выберите пользователя
            </div>

            <div
              class="chat-status"
              id="chatStatus"
            >
              Начните новый чат
            </div>

          </div>

        </div>


        <div
          class="messages"
          id="messages"
        >

          <div class="empty-chat">
            Выберите пользователя слева
          </div>

        </div>


        <form
          class="message-form"
          id="messageForm"
        >

          <textarea
            class="message-input"
            id="messageInput"
            rows="1"
            placeholder="Напишите сообщение..."
            disabled
          ></textarea>

          <button
            class="send-button"
            type="submit"
            disabled
            id="sendBtn"
          >
            ➤
          </button>

        </form>

      </main>

    </div>

  </section>


  <!-- PROFILE MODAL -->

  <div
    class="modal hidden"
    id="profileModal"
  >

    <div class="modal-box">

      <div class="modal-title">
        👤 Мой профиль
      </div>

      <div class="profile-avatar-wrap">

        <div
          class="profile-avatar"
          id="profileAvatarPreview"
        >
          ?
        </div>

      </div>

      <label class="file-label">

        📷 Изменить аватар

        <input
          id="avatarInput"
          type="file"
          accept="image/*"
          class="hidden"
        />

      </label>

      <div
        class="profile-message"
        id="profileMessage"
      ></div>

      <input
        class="profile-input"
        id="displayNameInput"
        type="text"
        placeholder="Ваше имя"
        maxlength="40"
      />

      <textarea
        class="profile-textarea"
        id="bioInput"
        placeholder="О себе"
        maxlength="160"
      ></textarea>

      <div class="modal-buttons">

        <button
          class="close-modal"
          id="closeProfileBtn"
          type="button"
        >
          Отмена
        </button>

        <button
          class="save-profile"
          id="saveProfileBtn"
          type="button"
        >
          Сохранить
        </button>

      </div>

    </div>

  </div>


<script>

  /* =========================
     GLOBAL VARIABLES
  ========================= */

  let token = localStorage.getItem("token") || "";

  let me = null;

  let users = [];

  let currentUser = null;

  let ws = null;

  let avatarData = "";


  /* =========================
     ELEMENTS
  ========================= */

  const auth = document.getElementById("auth");
  const app = document.getElementById("app");

  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");

  const authMessage = document.getElementById("authMessage");

  const logoutBtn = document.getElementById("logoutBtn");
  const profileBtn = document.getElementById("profileBtn");

  const searchInput = document.getElementById("searchInput");
  const userList = document.getElementById("userList");

  const layout = document.getElementById("layout");

  const chatName = document.getElementById("chatName");
  const chatStatus = document.getElementById("chatStatus");
  const chatAvatar = document.getElementById("chatAvatar");

  const messages = document.getElementById("messages");

  const messageForm = document.getElementById("messageForm");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  const backBtn = document.getElementById("backBtn");

  const profileModal = document.getElementById("profileModal");

  const profileAvatarPreview =
    document.getElementById("profileAvatarPreview");

  const avatarInput =
    document.getElementById("avatarInput");

  const displayNameInput =
    document.getElementById("displayNameInput");

  const bioInput =
    document.getElementById("bioInput");

  const profileMessage =
    document.getElementById("profileMessage");

  const closeProfileBtn =
    document.getElementById("closeProfileBtn");

  const saveProfileBtn =
    document.getElementById("saveProfileBtn");


  /* =========================
     API
  ========================= */

  async function api(url, options = {}) {

    const headers = {
      ...(options.headers || {})
    };

    if (
      options.body &&
      typeof options.body === "object" &&
      !(options.body instanceof FormData)
    ) {
      headers["Content-Type"] = "application/json";

      options.body = JSON.stringify(options.body);
    }

    if (token) {
      headers["Authorization"] = "Bearer " + token;
    }

    const response = await fetch(url, {
      ...options,
      headers
    });

    let data = {};

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Ошибка сервера"
      );
    }

    return data;
  }


  /* =========================
     AUTH
  ========================= */

  loginBtn.addEventListener("click", login);

  registerBtn.addEventListener("click", register);


  usernameInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
      passwordInput.focus();
    }

  });


  passwordInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
      login();
    }

  });


  async function login() {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;

    if (!username || !password) {

      authMessage.textContent =
        "Введите логин и пароль";

      return;
    }

    authMessage.textContent =
      "Выполняется вход...";

    try {

      const data = await api(
        "/api/login",
        {
          method: "POST",
          body: {
            username,
            password
          }
        }
      );

      token = data.token;

      localStorage.setItem(
        "token",
        token
      );

      await startApp();

    } catch (error) {

      authMessage.textContent =
        error.message;

    }

  }


  async function register() {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;

    if (!username || !password) {

      authMessage.textContent =
        "Введите логин и пароль";

      return;
    }

    authMessage.textContent =
      "Создание аккаунта...";

    try {

      const data = await api(
        "/api/register",
        {
          method: "POST",
          body: {
            username,
            password
          }
        }
      );

      token = data.token;

      localStorage.setItem(
        "token",
        token
      );

      await startApp();

    } catch (error) {

      authMessage.textContent =
        error.message;

    }

  }


  async function startApp() {

    try {

      const data =
        await api("/api/me");

      me = data.user;

      auth.classList.add("hidden");
      app.classList.remove("hidden");

      await loadUsers();

      connectWebSocket();

    } catch (error) {

      localStorage.removeItem("token");

      token = "";

      auth.classList.remove("hidden");
      app.classList.add("hidden");

      authMessage.textContent =
        "Сессия закончилась. Войдите снова.";

    }

  }


  logoutBtn.addEventListener("click", () => {

    localStorage.removeItem("token");

    token = "";

    if (ws) {
      ws.close();
      ws = null;
    }

    location.reload();

  });


  /* =========================
     USERS
  ========================= */

  async function loadUsers() {

    try {

      users =
        await api("/api/users");

      renderUsers();

    } catch (error) {

      console.error(error);

    }

  }


  function renderUsers() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    userList.innerHTML = "";

    const filtered =
      users.filter(user => {

        const name =
          (
            user.displayName ||
            user.username ||
            ""
          ).toLowerCase();

        const username =
          (
            user.username ||
            ""
          ).toLowerCase();

        return (
          name.includes(search) ||
          username.includes(search)
        );

      });


    if (filtered.length === 0) {

      userList.innerHTML =
        `<div style="
          padding:20px;
          text-align:center;
          color:#777;
        ">
          Пользователи не найдены
        </div>`;

      return;
    }


    filtered.forEach(user => {

      const item =
        document.createElement("div");

      item.className =
        "user-item";

      if (
        currentUser &&
        currentUser.id === user.id
      ) {
        item.classList.add("active");
      }


      const avatar =
        document.createElement("div");

      avatar.clas
