<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3390ec">
<title>Messenger 3.0</title>
<style>
:root{--blue:#3390ec;--bg:#eef3f7;--panel:#fff;--text:#17212b;--muted:#7d8b99;--line:#e4e9ee;--bubble:#fff;--mine:#d9fdd3}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#dbeeff,#f7fbff)}
.auth-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0002}.auth-card h1{margin:0 0 6px}.auth-card p{color:var(--muted);margin:0 0 22px}
.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;margin:6px 0;outline:0}.field:focus{border-color:var(--blue)}
.auth-actions{display:flex;gap:8px;margin-top:12px}.primary{background:var(--blue);color:#fff;padding:12px 16px;border-radius:13px;font-weight:700}.secondary{background:#edf3f8;color:var(--text);padding:12px 16px;border-radius:13px;font-weight:600}
#app{height:100%;display:flex;overflow:hidden;background:var(--panel)}
.sidebar{width:360px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.side-head{padding:14px;border-bottom:1px solid var(--line)}.me-row{display:flex;align-items:center;gap:10px}.me-info{flex:1;min-width:0}.me-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-user{font-size:12px;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:50%;background:#edf3f8;color:#445;display:grid;place-items:center;font-size:18px}.icon:hover{background:#dfeaf3}
.avatar{width:48px;height:48px;border-radius:50%;background:#55a8ef;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
.search{margin-top:12px;width:100%;padding:11px 14px;border:0;border-radius:14px;background:#eef3f7;outline:0}
.tabs{display:flex;padding:8px 10px;gap:6px}.tab{flex:1;padding:8px;border-radius:10px;background:transparent;color:var(--muted)}.tab.active{background:#e6f2ff;color:var(--blue);font-weight:700}
.list{overflow:auto;flex:1}.item{display:flex;gap:11px;padding:11px 14px;align-items:center;cursor:pointer}.item:hover,.item.active{background:#eef6ff}.item-info{min-width:0;flex:1}.item-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{color:#20a464}.dot{width:9px;height:9px;border-radius:50%;background:#24b36b;display:inline-block;margin-right:4px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-head{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px}.back{display:none}.chat-info{min-width:0;flex:1}.chat-title{font-weight:800}.chat-sub{font-size:12px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:6px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.msg{max-width:min(78%,620px);align-self:flex-start}.msg.mine{align-self:flex-end}.bubble{background:var(--bubble);border-radius:16px 16px 16px 5px;padding:9px 12px;box-shadow:0 1px 2px #0001;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:var(--mine);border-radius:16px 16px 5px 16px}.bubble.deleted{font-style:italic;color:var(--muted)}
.meta{font-size:10px;color:var(--muted);margin:3px 6px}.actions{display:flex;gap:5px;opacity:.7;margin:2px 4px}.actions button{background:#fff;border-radius:8px;padding:3px 7px;font-size:11px;color:#456}
.attach{display:block;margin-top:7px;border-radius:10px;max-width:280px;max-height:280px}.file-card{display:flex;gap:8px;align-items:center;background:#00000008;padding:8px;border-radius:10px;margin-top:7px}.file-card a{color:var(--blue);text-decoration:none;word-break:break-all}
.composer{padding:9px 12px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:end}.composer textarea{flex:1;resize:none;max-height:130px;min-height:44px;padding:11px 13px;border:0;border-radius:15px;background:#eef3f7;outline:0}.send{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-size:19px}.attach-btn{width:42px;height:42px;border-radius:50%;background:#eef3f7}
.typing{height:20px;padding:0 18px;color:var(--blue);font-size:12px;background:#fff}.status{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:14px;z-index:50;display:none}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:18px;z-index:40}.modal-card{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{background:#eef3f7;border-radius:50%;width:36px;height:36px}.preview{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:10px auto}.member-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px}.member{display:flex;align-items:center;gap:8px;padding:8px}.member input{width:18px;height:18px}
.toast{position:fixed;right:16px;bottom:76px;background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:60;display:none}
@media(max-width:760px){.sidebar{width:100%;min-width:0}.chat{display:none}.chat.open{display:flex}.sidebar.hide-mobile{display:none}.back{display:grid}.msg{max-width:88%}}
</style>
</head>
<body>
<div id="status" class="status"></div>
<section id="auth">
  <div class="auth-card">
    <h1>💬 Messenger 3.0</h1><p>Личные сообщения, группы, файлы и профиль</p>
    <input id="login" class="field" placeholder="Логин" autocomplete="username">
    <input id="password" class="field" placeholder="Пароль" type="password" autocomplete="current-password">
    <div class="auth-actions"><button id="loginBtn" class="primary">Войти</button><button id="registerBtn" class="secondary">Регистрация</button></div>
    <button id="demoNotif" class="secondary" style="width:100%;margin-top:8px">🔔 Включить уведомления</button>
  </div>
</section>

<section id="app" class="hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="me-row">
        <div id="myAvatar" class="avatar">?</div><div class="me-info"><div id="myName" class="me-name">...</div><div id="myUser" class="me-user">@...</div></div>
        <button id="profileBtn" class="icon">⚙️</button><button id="newGroupBtn" class="icon">👥</button><button id="logoutBtn" class="icon">↪</button>
      </div>
      <input id="search" class="search" placeholder="Поиск пользователей...">
    </div>
    <div class="tabs"><button id="peopleTab" class="tab active">Люди</button><button id="groupsTab" class="tab">Группы</button></div>
    <div id="list" class="list"></div>
  </aside>
  <main id="chat" class="chat">
    <header class="chat-head">
      <button id="backBtn" class="icon back">‹</button><div id="chatAvatar" class="avatar">?</div>
      <div class="chat-info"><div id="chatTitle" class="chat-title">Выберите чат</div><div id="chatSub" class="chat-sub">Начни новую переписку</div></div>
    </header>
    <div id="typing" class="typing"></div>
    <div id="messages" class="messages"><div class="empty">Выбери пользователя или группу слева.</div></div>
    <form id="composer" class="composer">
      <input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.zip,.doc,.docx">
      <button type="button" id="attachBtn" class="attach-btn">📎</button>
      <textarea id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
      <button class="send" type="submit">➤</button>
    </form>
  </main>
</section>

<div id="profileModal" class="modal hidden"><div class="modal-card">
  <div class="modal-head"><h2>Мой профиль</h2><button class="close" data-close="profileModal">×</button></div>
  <img id="profilePreview" class="preview" alt="">
  <input id="avatarInput" type="file" accept="image/*" class="field">
  <input id="profileName" class="field" placeholder="Имя">
  <textarea id="profileBio" class="field" maxlength="160" placeholder="О себе"></textarea>
  <button id="saveProfile" class="primary" style="width:100%">Сохранить</button>
</div></div>

<div id="groupModal" class="modal hidden"><div class="modal-card">
  <div class="modal-head"><h2>Новая группа</h2><button class="close" data-close="groupModal">×</button></div>
  <input id="groupName" class="field" placeholder="Название группы">
  <p style="color:var(--muted)">Выбери участников:</p><div id="memberList" class="member-list"></div>
  <button id="createGroup" class="primary" style="width:100%;margin-top:12px">Создать группу</button>
</div></div>

<div id="groupInfoModal" class="modal hidden"><div class="modal-card">
  <div class="modal-head"><h2>Настройки группы</h2><button class="close" data-close="groupInfoModal">×</button></div>
  <input id="groupEditName" class="field" placeholder="Название">
  <button id="saveGroup" class="primary" style="width:100%">Сохранить название</button>
  <p style="color:var(--muted)">Добавить участника:</p><select id="addMemberSelect" class="field"></select>
  <button id="addMember" class="secondary" style="width:100%">Добавить</button>
</div></div>

<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem("messenger_token")||"", me=null, ws=null, users=[], groups=[], current=null, currentType=null, avatarData="", reconnectTimer=null, typingTimer=null, sendingMessage=false;
const auth=$("auth"), app=$("app"), list=$("list"), messages=$("messages");

function showStatus(t,ms=1800){const e=$("status");e.textContent=t;e.style.display="block";clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>e.style.display="none",ms)}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)}
async function api(path,opt={}){const headers={"Content-Type":"application/json",...(opt.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(path,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Ошибка запроса");return d}
function initial(x){return (x||"?").trim().charAt(0).toUpperCase()||"?"}
function avatar(el,u){el.innerHTML="";if(u?.avatar){const i=document.createElement("img");i.src=u.avatar;el.appendChild(i)}else el.textContent=initial(u?.displayName||u?.username||u?.name)}
function closeModals(){document.querySelectorAll(".modal").forEach(x=>x.classList.add("hidden"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add("hidden"));

$("loginBtn").onclick=()=>login(false);$("registerBtn").onclick=()=>login(true);
async function login(reg){try{const d=await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify({username:$("login").value,password:$("password").value})});token=d.token;me=d.user;localStorage.setItem("messenger_token",token);await start()}catch(e){toast(e.message)}}
$("logoutBtn").onclick=()=>{localStorage.removeItem("messenger_token");location.reload()};
async function start(){try{const d=await api("/api/me");me=d.user;auth.classList.add("hidden");app.classList.remove("hidden");renderMe();await loadAll();connect();registerPush()}catch(e){localStorage.removeItem("messenger_token");toast("Сессия истекла")}}
function renderMe(){avatar($("myAvatar"),me);$("myName").textContent=me.displayName||me.username;$("myUser").textContent="@"+me.username}
async function loadAll(){await Promise.all([loadUsers(),loadGroups()]);renderList()}
async function loadUsers(){const d=await api("/api/users");users=d.users||[]}
async function loadGroups(){const d=await api("/api/groups");groups=d.groups||[]}
function renderList(){const q=$("search").value.trim().toLowerCase();list.innerHTML="";const source=currentType==="group"||$("groupsTab").classList.contains("active")?groups:users;source.filter(x=>!q||((x.name||x.displayName||x.username||"").toLowerCase().includes(q))).forEach(x=>{const item=document.createElement("div");item.className="item "+(current?.id===x.id?"active":"");const av=document.createElement("div");av.className="avatar";avatar(av,x);const inf=document.createElement("div");inf.className="item-info";const t=document.createElement("div");t.className="item-title";t.textContent=x.name||x.displayName||x.username;const s=document.createElement("div");s.className="item-sub";s.textContent=x.name?"👥 "+x.memberCount+" участников":x.online?"● В сети":"Не в сети";if(x.online)s.classList.add("online");inf.append(t,s);item.append(av,inf);item.onclick=()=>openChat(x,x.name?"group":"user");list.appendChild(item)})}
$("peopleTab").onclick=()=>{currentType="user";$("peopleTab").classList.add("active");$("groupsTab").classList.remove("active");renderList()};
$("groupsTab").onclick=()=>{currentType="group";$("groupsTab").classList.add("active");$("peopleTab").classList.remove("active");renderList()};
$("search").oninput=renderList;

async function openChat(x,type){current=x;currentType=type;$("sidebar").classList.add("hide-mobile");$("chat").classList.add("open");avatar($("chatAvatar"),x);$("chatTitle").textContent=x.name||x.displayName||x.username;$("chatSub").textContent=type==="group"?x.memberCount+" участников":x.online?"● В сети":lastSeen(x.lastSeen);messages.innerHTML='<div class="empty">Загрузка...</div>';if(type==="group")await loadGroupMessages();else await loadPrivate()}
function lastSeen(v){if(!v)return"Не в сети";return"был(а) "+new Date(v).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
async function loadPrivate(){const d=await api("/api/messages/"+encodeURIComponent(current.id));renderMessages(d.messages||[])}
async function loadGroupMessages(){const d=await api("/api/groups/"+encodeURIComponent(current.id)+"/messages");renderMessages(d.messages||[])}
function renderMessages(arr){messages.innerHTML="";if(!arr.length){messages.innerHTML='<div class="empty">Сообщений пока нет.<br>Напиши первым!</div>';return}arr.forEach(renderMessage);scroll()}
function renderMessage(m){const wrap=document.createElement("div");wrap.className="msg "+(m.from===me.id?"mine":"");const b=document.createElement("div");b.className="bubble"+(m.deleted?" deleted":"");b.textContent=m.deleted?"Сообщение удалено":m.text||"";if(m.attachment&&!m.deleted)renderAttachment(b,m.attachment);wrap.appendChild(b);const meta=document.createElement("div");meta.className="meta";meta.textContent=(m.from!==me.id&&currentType==="group"?userName(m.from)+" · ":"")+new Date(m.createdAt).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+(m.editedAt?" · изменено":"");wrap.appendChild(meta);if(m.from===me.id&&!m.deleted){const a=document.createElement("div");a.className="actions";const ed=document.createElement("button");ed.textContent="Изменить";ed.onclick=()=>edit(m);const del=document.createElement("button");del.textContent="Удалить";del.onclick=()=>delMsg(m);a.append(ed,del);wrap.appendChild(a)}messages.appendChild(wrap)}
function userName(id){const u=users.find(x=>x.id===id)||dbUser(id);return u?.displayName||u?.username||"Пользователь"}
function dbUser(id){return id===me.id?me:null}
function renderAttachment(parent,a){if(a.type.startsWith("image/")){const i=document.createElement("img");i.className="attach";i.src=a.data;i.alt=a.name;parent.appendChild(i)}const card=document.createElement("div");card.className="file-card";const link=document.createElement("a");link.href=a.data;link.download=a.name;link.textContent="📎 "+a.name+" ("+Math.max(1,Math.round((a.size||0)/1024))+" КБ)";card.appendChild(link);parent.appendChild(card)}
function scroll(){messages.scrollTop=messages.scrollHeight}
async function edit(m){const t=prompt("Изменить сообщение:",m.text);if(t===null||!t.trim())return;sendWS({type:"edit",id:m.id,text:t.trim()})}
function delMsg(m){if(confirm("Удалить сообщение?"))sendWS({type:"delete",id:m.id})}

$("composer").onsubmit=async e=>{e.preventDefault();if(sendingMessage)return;const text=$("messageInput").value.trim();const f=$("fileInput").files[0];if(!current||(!text&&!f))return;sendingMessage=true;$("composer").querySelector(".send").disabled=true;let attachment=null;if(f){if(f.size>1800000){sendingMessage=false;$("composer").querySelector(".send").disabled=false;return toast("Файл слишком большой (максимум 1.8 МБ)")}attachment=await readFile(f)}const clientId=crypto.randomUUID();sendWS(currentType==="group"?{type:"groupMessage",groupId:current.id,text:text||" ",attachment,clientId}:{type:"message",to:current.id,text:text||" ",attachment,clientId});$("messageInput").value="";$("fileInput").value="";$("messageInput").focus();setTimeout(()=>{sendingMessage=false;$("composer").querySelector(".send").disabled=false},450)}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name,type:f.type||"application/octet-stream",size:f.size,data:r.result});r.onerror=rej;r.readAsDataURL(f)})}
$("attachBtn").onclick=()=>$("fileInput").click();
$("messageInput").addEventListener("input",()=>{if(!ws||ws.readyState!==1||!current)return;sendWS(currentType==="group"?{type:"typing",groupId:current.id,typing:true}:{type:"typing",to:current.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>sendWS(currentType==="group"?{type:"typing",groupId:current.id,typing:false}:{type:"typing",to:current.id,typing:false}),900)});
function sendWS(x){if(!ws||ws.readyState!==1)return toast("Нет соединения с сервером");ws.send(JSON.stringify(x))}
function connect(){if(!token)return;const p=location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(p+"//"+location.host+"/?token="+encodeURIComponent(token));ws.onopen=()=>showStatus("🟢 Онлайн");ws.onclose=()=>{showStatus("🔴 Соединение потеряно");clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,2500)};ws.onerror=e=>console.log(e);ws.onmessage=onWS}
async function onWS(e){let d;try{d=JSON.parse(e.data)}catch{return}
 if(d.type==="message"||d.type==="groupMessage"){const m=d.message;const relevant=current&&(currentType==="group"?m.groupId===current.id:((m.from===me.id&&m.to===current.id)||(m.from===current.id&&m.to===me.id)));if(relevant){if(messages.querySelector(".empty"))messages.innerHTML="";renderMessage(m);scroll()}else if(m.from!==me.id){notifyForeground(m)}if(d.type==="message"&&m.from!==me.id)await loadUsers();return}
 if(d.type==="messageUpdated"){if(current)currentType==="group"?loadGroupMessages():loadPrivate();return}
 if(d.type==="presence"){const u=users.find(x=>x.id===d.userId);if(u){u.online=d.online;u.lastSeen=d.lastSeen}renderList();if(current?.id===d.userId&&currentType==="user"){$("chatSub").textContent=d.online?"● В сети":lastSeen(d.lastSeen)}return}
 if(d.type==="userUpdated"){const i=users.findIndex(x=>x.id===d.user.id);if(i>=0)users[i]={...users[i],...d.user};if(me.id===d.user.id){me=d.user;renderMe()}renderList();return}
 if(d.type==="groupCreated"||d.type==="groupUpdated"){await loadGroups();renderList();if(current&&d.group.id===current.id){current=d.group;avatar($("chatAvatar"),current);$("chatTitle").textContent=current.name;$("chatSub").textContent=current.members.length+" участников"}return}
 if(d.type==="typing"){if(current&&(d.from===current.id||d.groupId===current.id)){ $("typing").textContent=d.typing?(currentType==="group"?userName(d.from)+" печатает...":"печатает..."):"";setTimeout(()=>$("typing").textContent="",1400)}}
 if(d.type==="error")toast(d.error||"Ошибка");
}
function notifyForeground(m){const title=currentType==="group"?(current?.name||"Новое сообщение"):userName(m.from);toast("💬 "+title+": "+(m.text||"📎 файл"));if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(title,{body:m.text||"📎 Файл"})}

$("backBtn").onclick=()=>{$("sidebar").classList.remove("hide-mobile");$("chat").classList.remove("open");current=null};
$("profileBtn").onclick=()=>{ $("profileName").value=me.displayName||me.username;$("profileBio").value=me.bio||"";$("profilePreview").src=me.avatar||"";if(!me.avatar)$("profilePreview").alt=initial(me.displayName||me.username);$("profileModal").classList.remove("hidden")};
$("avatarInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>500000)return toast("Аватар максимум 500 КБ");avatarData=(await readFile(f)).data;$("profilePreview").src=avatarData};
$("saveProfile").onclick=async()=>{try{const body={displayName:$("profileName").value.trim(),bio:$("profileBio").value.trim()};if(avatarData)body.avatar=avatarData;const d=await api("/api/me",{method:"PUT",body:JSON.stringify(body)});me=d.user;avatarData="";renderMe();$("profileModal").classList.add("hidden");await loadUsers();renderList()}catch(e){toast(e.message)}};

$("newGroupBtn").onclick=async()=>{await loadUsers();$("memberList").innerHTML="";users.forEach(u=>{const row=document.createElement("label");row.className="member";const c=document.createElement("input");c.type="checkbox";c.value=u.id;const a=document.createElement("span");a.textContent=u.displayName+" (@"+u.username+")";row.append(c,a);$("memberList").appendChild(row)});$("groupName").value="";$("groupModal").classList.remove("hidden")};
$("createGroup").onclick=async()=>{const ids=[...$("memberList").querySelectorAll("input:checked")].map(x=>x.value);try{const d=await api("/api/groups",{method:"POST",body:JSON.stringify({name:$("groupName").value,memberIds:ids})});groups.push(d.group);$("groupModal").classList.add("hidden");$("groupsTab").click();openChat(d.group,"group")}catch(e){toast(e.message)}};

function openGroupInfo(){if(currentType!=="group")return;$("groupEditName").value=current.name;$("addMemberSelect").innerHTML="";users.filter(u=>!current.members.includes(u.id)).forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.displayName+" (@"+u.username+")";$("addMemberSelect").appendChild(o)});$("groupInfoModal").classList.remove("hidden")}
$("chatTitle").onclick=()=>openGroupInfo();
$("saveGroup").onclick=async()=>{try{const d=await api("/api/groups/"+current.id,{method:"PUT",body:JSON.stringify({name:$("groupEditName").value})});current=d.group;$("groupInfoModal").classList.add("hidden");await loadGroups();renderList();openChat(current,"group")}catch(e){toast(e.message)}};
$("addMember").onclick=async()=>{try{const id=$("addMemberSelect").value;if(!id)return;const d=await api("/api/groups/"+current.id+"/members",{method:"POST",body:JSON.stringify({userId:id})});current=d.group;$("groupInfoModal").classList.add("hidden");await loadGroups();renderList();openChat(current,"group")}catch(e){toast(e.message)}};

async function registerPush(){try{if(!("serviceWorker"in navigator)||!("Notification"in window))return;await navigator.serviceWorker.register("/sw.js");const cfg=await api("/api/push/config");if(!cfg.publicKey)return;if(Notification.permission==="default")return;const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64(cfg.publicKey)});await api("/api/push/subscribe",{method:"POST",body:JSON.stringify({subscription:sub})})}catch(e){console.log("push:",e.message)}}
function urlBase64(s){const pad="=".repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
$("demoNotif").onclick=async()=>{if(!("Notification"in window))return toast("Уведомления не поддерживаются");const p=await Notification.requestPermission();toast(p==="granted"?"Уведомления включены":"Уведомления отключены");if(p==="granted")registerPush()};

if(token)start();
